name: release

# A tag `vX.Y.Z` builds one tarball for x86_64 Linux and attaches it to a GitHub Release:
# the runner binary, `aeiou-header` beside it (one file carrying Python, numpy, h5py, and
# libhdf5 at the versions uv.lock pins; DESIGN_REVIEW.md §3.70), and `aeiou-launch`, the manual pages as roff and as Markdown, the
# committed abstracts under workloads/ with their parameter files, case locks, READMEs, descriptions, and catalog records, the builder's wheel, and
# QUICKSTART.md. Built on ubuntu-22.04 so the binary runs on glibc 2.34 and later (RHEL 9,
# Ubuntu 22.04, Debian 12 and newer); the runner links nothing but the C runtime (its S3 client
# uses rustls, no OpenSSL). Nothing is
# published to a registry. The tag must equal the version in runner/Cargo.toml and
# builder/pyproject.toml.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust, the version rust-toolchain.toml names
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: release
      # uv at builder/pyproject.toml's required-version, by checksum; the Python is builder/.python-version,
      # one uv downloads (the image's 3.10 is never used), the Python CI tests with (DESIGN_REVIEW.md §3.82)
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: builder/pyproject.toml
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f

      - name: The tag is the version
        run: |
          ver=${GITHUB_REF_NAME#v}
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' runner/Cargo.toml)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' builder/pyproject.toml)
          echo "tag=$ver cargo=$cargo pyproject=$py"
          [ "$ver" = "$cargo" ] && [ "$ver" = "$py" ] || { echo "version mismatch" >&2; exit 1; }
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "DIST=aeiou-$ver-x86_64-linux" >> "$GITHUB_ENV"

      - name: Build the runner
        working-directory: runner
        # the default features: the container writers (DESIGN_REVIEW.md §3.70) and the object engine (§3.65,
        # runner/REFERENCE.md §16), so one binary serves every format and S3 stores alike (2026-10-16)
        run: cargo build --release --bin aeiou

      - name: Build the builder's wheel
        working-directory: builder
        # beside it, the lock's versions and hashes of what it needs, the format classes' libraries
        # included, and the Python they were tested with, for an install that resolves nothing
        run: |
          uv build --wheel -o ../wheel
          uv export --locked --extra formats --no-emit-project --no-dev -o ../wheel/requirements.txt
          cp .python-version ../wheel/python-version

      - name: Build aeiou-header, one file, for bin/ beside aeiou
        working-directory: builder
        run: |
          printf 'import sys\nfrom aeiou.header import main\nsys.exit(main())\n' > /tmp/aeiou_header.py
          # h5py and numpy are imported by name at run time, so PyInstaller is told of them; PyInstaller
          # is the lock's (the `release` group)
          uv run --locked --extra formats --group release pyinstaller --onefile --name aeiou-header \
            --hidden-import h5py --hidden-import numpy --distpath ../header-dist --workpath /tmp/pyi --specpath /tmp \
            /tmp/aeiou_header.py

      - name: Assemble the tarball
        run: |
          # pandoc, the pinned release by checksum (not the image's)
          curl -sSfL -o /tmp/pandoc.tgz https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-linux-amd64.tar.gz
          echo "d0c90410e90204c9ca83b8539fac5c7aed01fd537207e4585849f8abc5df20b8  /tmp/pandoc.tgz" | sha256sum -c
          tar xzf /tmp/pandoc.tgz -C /tmp && pandoc=/tmp/pandoc-3.12.1/bin/pandoc
          d="$DIST"
          mkdir -p "$d/bin" "$d/share/man/man1" "$d/share/man/man5" "$d/share/man/man7" \
                   "$d/man" "$d/wheel"
          cp runner/target/release/aeiou header-dist/aeiou-header runner/aeiou-launch "$d/bin/"
          for p in man/*.[157].md; do
            page=$(basename "${p%.md}")        # aeiou.1
            sec=${page##*.}                     # 1
            "$pandoc" -s -t man --shift-heading-level-by=-1 \
              -V header="aeiou manual" -V footer="aeiou $VER" -V date="$(date -u +%Y-%m-%d)" \
              "$p" -o "$d/share/man/man$sec/$page"
          done
          cp man/*.md "$d/man/"
          git ls-files workloads | grep -E '(\.ast\.json|params\.json|case\.lock\.json|README\.md|DESCRIPTION\.md|CATALOG\.md|catalog\.json|\.toml|shape\.json)$' | tar -cf - -T - | tar -xf - -C "$d"
          cp wheel/*.whl wheel/requirements.txt wheel/python-version "$d/wheel/"
          cp QUICKSTART.md LICENSE "$d/"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > "$d.tar.gz.sha256"
          ls -l "$d.tar.gz"; tar tzf "$d.tar.gz" | sed 's,^[^/]*/,,' | sort

      - name: Smoke-test the tarball
        run: |
          mkdir smoke && tar xzf "$DIST.tar.gz" -C smoke && cd "smoke/$DIST"
          bin/aeiou --version
          # the object engine is in (a build without it carries this refusal)
          ! grep -aq 'built without the object engine' bin/aeiou
          bin/aeiou-header --version
          # HDF5 through the aeiou-header beside aeiou, in an environment with no Python
          # (through its case's lock, which gives the job's values the abstract requires)
          env -i PATH=/usr/bin:/bin bin/aeiou datagen --case-file workloads/input-pipeline/map/hdf5/cases/rgb256-rows/case.lock.json \
            --root /tmp/smoke-h5 --param samples=20 --param samples_per_file=8 | grep "header(s) from"
          bin/aeiou check $(find workloads -name '*.ast.json')
          bin/aeiou dry-run workloads/input-pipeline/map/file-per-sample/file_per_sample.ast.json --gpus 2 --seed 1 \
            --params-file workloads/input-pipeline/map/file-per-sample/params/smoke.params.json | tail -3
          man -l share/man/man1/aeiou.1 | head -5
          # as QUICKSTART.md installs it
          uv venv -q --python "$(cat wheel/python-version)" --managed-python .venv
          uv pip install -q --python .venv/bin/python --require-hashes -r wheel/requirements.txt
          uv pip install -q --python .venv/bin/python --no-deps wheel/*.whl
          .venv/bin/aeiou-build --help | head -2

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "aeiou $GITHUB_REF_NAME" --generate-notes \
            "$DIST.tar.gz" "$DIST.tar.gz.sha256"
