name: ci

on:
  push:
  pull_request:

jobs:
  abstracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        working-directory: builder
        run: uv sync --locked --extra test
      - name: Reference checker over the committed ASTs
        run: builder/.venv/bin/python schema/check.py
      - name: Builder tests
        working-directory: builder
        run: .venv/bin/pytest -q
      - name: Hermetic build-twice of every abstract, compared with the committed ASTs
        working-directory: builder
        run: .venv/bin/aeiou-build --hermetic --twice --check -o ../schema/examples abstracts/*.py
      - name: Parameter files fit their abstracts
        working-directory: builder
        run: |
          for f in ../schema/examples/params/*.params.json; do
            a=$(basename "$f" | cut -d. -f1)
            .venv/bin/aeiou-params check "../schema/examples/$a.ast.json" "$f" || exit 1
          done

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - name: Build and test
        working-directory: runner
        run: cargo test --release
      - name: Rust checker agrees with the reference checker on every committed AST
        run: |
          pip install jsonschema
          python3 schema/check.py > /tmp/check.py.out
          runner/target/release/aeiou check schema/examples/*.ast.json > /tmp/check.rs.out
          diff /tmp/check.py.out /tmp/check.rs.out
