name: ci

on:
  push:
  pull_request:

# Four jobs on four runners (4 cores each); the fourth, `runner-object`, builds the object engine. `abstracts` needs no Rust. The runner's own
# tests and the Python tests that drive the built binary each build on their own runner from
# one shared Rust cache: the test binaries are compiled only where they are run, and the
# integration job builds the `aeiou` binary alone. The pytest suites run on 4 workers, the
# runner's test binaries under cargo-nextest (every test its own process, 4 at a time; there
# are no doctests for it to miss), and a kit pair's four seeds as four processes.
jobs:
  abstracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        working-directory: builder
        run: uv sync --locked --extra test --extra formats
      - name: Reference checker over the committed ASTs
        run: builder/.venv/bin/python schema/check.py
      - name: Builder tests
        working-directory: builder
        run: .venv/bin/pytest -q -n 4
      - name: Hermetic build-twice of every abstract, compared with the committed ASTs
        working-directory: builder
        run: .venv/bin/aeiou-build --hermetic --twice --check -o ../schema/examples abstracts/*.py
      - name: Parameter files fit their abstracts
        working-directory: builder
        run: |
          for f in ../schema/examples/params/*.params.json; do
            a=$(basename "$f" | cut -d. -f1)
            .venv/bin/aeiou-params check "../schema/examples/$a.ast.json" "$f" || exit 1
          done

  runner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner
      - uses: taiki-e/install-action@nextest
      - name: Build and test
        working-directory: runner
        run: cargo nextest run --release

  # The object engine (cargo feature `object`, runner/REFERENCE.md §16) against MinIO: the last
  # release that has binaries (the project archived its repository), checked by SHA-256.
  runner-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner-object
      - uses: taiki-e/install-action@nextest
      - name: MinIO server
        run: |
          curl -sSfL -o /tmp/minio https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  /tmp/minio" | sha256sum -c
          chmod +x /tmp/minio
      - name: Build with the object engine and test it
        working-directory: runner
        run: TEST_MINIO_BIN=/tmp/minio cargo nextest run --release --features object -E 'test(/object/) | test(/endpoint/)'

  runner-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner
      - name: Build the binary
        working-directory: runner
        run: cargo build --release --bin aeiou
      - uses: astral-sh/setup-uv@v5
      - name: Builder with the format classes' libraries
        working-directory: builder
        run: uv sync --locked --extra test --extra formats
      - name: Rust checker agrees with the reference checker on every committed AST
        run: |
          builder/.venv/bin/python schema/check.py > /tmp/check.py.out
          runner/target/release/aeiou check schema/examples/*.ast.json | sed '1,/^$/d' > /tmp/check.rs.out   # past the options block
          diff /tmp/check.py.out /tmp/check.rs.out
      - name: Container datasets run to the dry-run fingerprint; traces and kit pairs against the binary
        working-directory: builder
        run: |
          command -v strace || sudo apt-get install -y strace
          AEIOU_RUNNER=../runner/target/release/aeiou .venv/bin/pytest -q -n 4 -rs tests/test_formats.py tests/test_trace.py
