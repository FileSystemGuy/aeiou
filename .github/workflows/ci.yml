name: ci

on:
  push:
  pull_request:

# Four jobs on four runners (4 cores each), each `./dev.sh check JOB` (DESIGN_REVIEW.md §3.83):
# the steps are dev.sh's, so a checkout runs exactly what CI runs, and this file only sets up
# what dev.sh needs, rustup's Rust and uv. The runner's whole suite, the object engine's tests
# against MinIO included (`object` and `formats` are default features, 2026-10-16), runs in
# `runner-tests`; the fourth, `runner-object`, runs the object engine's tests again in the build
# without `formats`, so that build is compiled too, and the Python writer into a bucket read back
# by the engine. `abstracts` needs no Rust. The runner's own tests and the Python tests that drive
# the built binary each build on their own runner from one shared Rust cache: the test binaries
# are compiled only where they are run, and the integration job builds the `aeiou` binary alone.
# The pytest suites run on every core, the runner's test binaries under cargo-nextest (every test
# its own process; there are no doctests for it to miss), and a kit pair's four seeds as four
# processes.
# Every tool is a version the repository names (DESIGN_REVIEW.md §3.82): the image, Rust
# (rust-toolchain.toml), uv (builder/pyproject.toml's required-version, by checksum), and Python
# (builder/.python-version, always one uv downloads, never the image's), the packages from
# uv.lock, and nextest and MinIO (dev.sh, by SHA-256). strace is the image's, so a new image is a
# deliberate change here.
jobs:
  abstracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: builder/pyproject.toml
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      # the reference checker over the committed ASTs, the builder's tests, the hermetic
      # build-twice of every abstract against the committed ASTs, the parameter files against their abstracts
      - name: dev.sh check abstracts
        run: ./dev.sh check abstracts

  runner-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust, the version rust-toolchain.toml names
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner
      # every test, the object engine's against MinIO included; then a build without the object
      # engine refuses an object endpoint
      - name: dev.sh check runner
        run: ./dev.sh check runner

  runner-object:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust, the version rust-toolchain.toml names
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner-object
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: builder/pyproject.toml
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      # the object engine (cargo feature `object`; runner/REFERENCE.md §16) against MinIO in the
      # build without `formats`; then aeiou-datagen into the bucket, read back by the engine to
      # the dry-run fingerprint
      - name: dev.sh check object
        run: ./dev.sh check object

  runner-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust, the version rust-toolchain.toml names
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
          shared-key: runner
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version-file: builder/pyproject.toml
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: strace, the image's
        run: command -v strace || sudo apt-get install -y strace
      # the Rust checker against the reference checker on every committed AST; every Python
      # test against the binary, `AEIOU_REQUIRE` (builder/tests/conftest.py) failing any skipped
      # for something this job built: container datasets to the dry-run fingerprint, traces and
      # kit pairs, the catalog, the coordinator's frames, the payload, the usage frame
      # (DESIGN_REVIEW.md §3.75); the workload catalog, every shape re-measured at its check length
      - name: dev.sh check integration
        run: ./dev.sh check integration
