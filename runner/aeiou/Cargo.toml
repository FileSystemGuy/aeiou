[package]
name = "aeiou"
autotests = false
description = "Author Execute I/O workload runner (aeiou): loads, validates, and executes the AST contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aeiou"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1"
libc = "0.2"
dgen-data = { version = "=0.3.0", default-features = false }
io-uring = "0.7"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
# the object engine (DESIGN_REVIEW.md §3.65), behind the `object` feature: the default build has no tokio
object_store = { version = "=0.14.2", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }

[features]
object = ["dep:object_store", "dep:tokio", "dep:futures"]

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "limits"
path = "tests/limits.rs"

[[test]]
name = "uring_knobs"
path = "tests/uring_knobs.rs"
