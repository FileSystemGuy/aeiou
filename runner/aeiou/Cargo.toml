[package]
name = "aeiou"
autotests = false
description = "Author Execute I/O workload runner (aeiou): loads, validates, and executes the AST contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aeiou"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a float literal is read to the nearest f64, as Python's json reads it (the AST hash, RC1 review)
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive", "wrap_help"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
anyhow = "1"
libc = "0.2"
io-uring = "0.7"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
# the object engine (DESIGN_REVIEW.md §3.65), the `object` feature, on by default since 2026-10-16 so every
# build reads and writes S3; `--no-default-features` builds without it (no tokio) and without `formats`
object_store = { version = "=0.14.2", default-features = false, features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
# what object_store's payloads are made of: a part buffer handed to the store comes back to its pool (`Bytes::from_owner`)
bytes = { version = "1.9", default-features = false, optional = true }
# the container writers of `aeiou datagen` (DESIGN_REVIEW.md §3.70), the `formats` feature, on by default
# since 2026-10-16 as `object` is
crc32c = { version = "0.6", optional = true }

[features]
default = ["object", "formats"]
object = ["dep:object_store", "dep:tokio", "dep:futures", "dep:bytes"]
formats = ["dep:crc32c"]

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "limits"
path = "tests/limits.rs"

[[test]]
name = "uring_knobs"
path = "tests/uring_knobs.rs"
