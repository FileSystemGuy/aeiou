[project]
name = "aeiou"
version = "0.1.0"
description = "Author Execute I/O (aeiou): the Python builder of the workloads the Rust runner executes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# the format classes' libraries (reader protocols are probed and real files written with them)
formats = ["pyarrow>=25", "h5py>=3.16", "numpy>=2", "crc32c>=2.7", "dgen-py==0.3.0", "xxhash>=3.5"]

[project.scripts]
aeiou-build = "aeiou.cli:main"
aeiou-params = "aeiou.params:main"
aeiou-datagen = "aeiou.datagen:main"
aeiou-trace = "aeiou.trace:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeiou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
