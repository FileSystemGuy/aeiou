[project]
name = "aeiou"
version = "0.2.1"
description = "Author Execute I/O (aeiou): the Python builder of the workloads the Rust runner executes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]
# the format classes' libraries (reader protocols are probed and real files written with them)
formats = ["pyarrow>=25", "h5py>=3.16", "numpy>=2", "crc32c>=2.7", "xxhash>=3.5"]
# the object stores `aeiou-datagen` writes to: Python bindings to Apache `object_store`, the runner's engine
s3 = ["obstore>=0.11"]

[project.scripts]
aeiou-build = "aeiou.cli:main"
aeiou-params = "aeiou.params:main"
aeiou-datagen = "aeiou.datagen:main"
aeiou-trace = "aeiou.trace:main"
aeiou-catalog = "aeiou.catalog:main"
aeiou-header = "aeiou.header:main"

# Tools locked with the rest and installed only when asked (`uv sync --group NAME`): PyInstaller, which
# makes the release's one-file aeiou-header (.github/workflows/release.yml), and the coverage of the
# local full check (`pytest --cov`, coverage's `patch = subprocess` for the tools run as processes)
[dependency-groups]
release = ["pyinstaller==6.22.3"]
coverage = ["pytest-cov>=7.1", "coverage>=7.16"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeiou"]

# The interpreter is builder/.python-version, exactly, and always one uv downloads, never the system's
# (DESIGN_REVIEW.md §3.82); uv itself is this version, which setup-uv in CI reads from here.
[tool.uv]
required-version = "==0.13.5"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
