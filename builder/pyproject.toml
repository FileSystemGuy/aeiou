[project]
name = "aeiou"
version = "0.1.0"
description = "Python builder for abstract-driven I/O benchmark workloads: emits the AST the Rust runner executes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aeiou-build = "aeiou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeiou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
