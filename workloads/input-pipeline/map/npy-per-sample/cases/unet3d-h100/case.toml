# The case (workloads/attributes.toml, DESIGN_REVIEW.md §3.66): its curated attributes and what it runs.
kind = "use"
modality = "volume"
model-family = "vision"
accelerator = "h100"
gpus = [1]          # the GPU counts its parameters hold at; the shape is measured at the first

# the job's fragment and the model's on its accelerator (DESIGN_REVIEW.md §3.78 points 1 and 5)
[[run]]
ast = "npy_per_sample"
params = ["job.params.json", "h100.params.json"]
