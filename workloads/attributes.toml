# The dictionary of the workload catalog (DESIGN_REVIEW.md §3.66): every attribute a
# mechanism, a case, or a capture is labeled with, what it means, and its allowed values.
# `aeiou-catalog check` refuses an attribute or a value not defined here, and renders this
# file as the glossary of CATALOG.md. Adding a value is a one-line change; renaming or
# removing one is a recorded decision.
#
# source:  curated   written by a person in mechanism.toml or case.toml
#          derived   read by aeiou-catalog from the AST, the parameter file, or the captures
#          measured  computed by aeiou-catalog from `aeiou dry-run --metrics-json` of the case
#                    at the smallest length where the numbers are stable (shape.json)
# level:   mechanism | case
# A measured attribute's classes are tried in order; the first whose bounds hold is the
# class (`min` and `max` inclusive; a class with neither takes the rest). Its `tolerance` is
# how far two measurements may differ and still be the same number (`relative` to the larger,
# `absolute`, or both, either bound being enough); a flag has none and must be equal. `search` lists
# words a reader may look for; they change nothing any tool accepts. An attribute marked
# `multiple = true` takes a list of distinct values in a record; every other takes one. A value of
# `class` names the category it belongs to.

attributes_version = 1

# ---- curated: the mechanism ----
#
# The tree's first level is a class of system whose I/O is reproduced, named in the words storage
# people use for it: a subsystem for AI (kvcache, checkpointing), the application class elsewhere
# (software-build, database). Names are hyphenated nouns that avoid overloaded words (container,
# image, object, cache alone). There is no level for AI as such: `domain` says it, and a search
# filters by it. A second level, `class`, exists only where a category is large enough to need
# one, its values defined per category below. Every value has its directory, a mechanism or not,
# so the tree shows what the catalog means to cover and where a contribution goes
# (DESIGN_REVIEW.md §3.68).

[attribute.category]
meaning = "The class of system whose I/O the mechanism reproduces: the tree's first level."
source = "curated"
level = "mechanism"
required = true
[attribute.category.values]
input-pipeline = { meaning = "The read path that feeds a model its samples: a training job's loader, or batch inference reading a dataset the same way.", search = ["training", "dataloader", "data loading", "batch inference"] }
dataprep = { meaning = "Preparing data for training: curation, filtering, deduplication, shuffling, packing, tokenization, ingest.", search = ["data preparation", "etl", "curation", "preprocessing"] }
checkpointing = { meaning = "Saving and restoring a job's state: a training run's, or a simulation's checkpoint and restart.", search = ["checkpoint", "restore", "resume", "checkpoint/restart"] }
model-loading = { meaning = "Loading a model's weights to serve it: start-up, scale-out, failover, a model swap.", search = ["inference", "serving", "cold start", "weights"] }
kvcache = { meaning = "An inference engine's KV cache offloaded to storage and loaded back.", search = ["kv cache", "prefix cache", "kv offload", "inference"] }
vector-search = { meaning = "Nearest-neighbour search over vectors: building an index and searching it, as a library or a vector database does.", search = ["vector database", "vdb", "ann", "rag", "retrieval", "embeddings"] }
embedding-tables = { meaning = "Embedding tables larger than memory, looked up by id (recommender models), in training and in serving.", search = ["recommender", "recsys", "dlrm", "embeddings", "parameter server"] }
rl = { meaning = "Reinforcement learning: rollouts and a trainer, the weights pushed between them, replay buffers.", search = ["reinforcement learning", "rollouts", "rlhf"] }
agentic = { meaning = "AI agents' own tool I/O: checkouts, builds, scratch file systems of agent sandboxes (an agent's KV cache is kvcache).", search = ["agents", "sandbox", "coding agent"] }
software-build = { meaning = "Building software: checkouts, compiles, links, incremental rebuilds.", search = ["compile", "build", "swbuild", "ci"] }
eda = { meaning = "Electronic design automation: chip design's front-end (many small files) and back-end (large files).", search = ["chip design", "semiconductor"] }
vdi = { meaning = "Virtual desktops: their images at boot, at login, and in steady use.", search = ["virtual desktop", "boot storm"] }
media-ingest = { meaning = "Media and sensor streams written as they arrive: video acquisition, surveillance, instruments.", search = ["video", "vda", "surveillance", "streaming write"] }
database = { meaning = "Database engines' I/O: data pages and a write-ahead log, a key-value store's compaction.", search = ["oltp", "wal", "key-value store", "lsm"] }
genomics = { meaning = "Sequencing pipelines: alignment, sorting, variant calling.", search = ["bioinformatics", "life sciences", "sequencing"] }
hpc = { meaning = "Scientific simulation and analysis: N-to-N and N-to-1 output, analysis reads (checkpoint and restart are checkpointing).", search = ["simulation", "scientific computing", "mpi-io"] }
benchmarks = { meaning = "Benchmarks whose definition is the workload (IO500, SPECstorage): their defined operations, never a trace of an application.", search = ["synthetic", "io500", "spec", "mdtest", "ior"] }

[attribute.class]
meaning = "The second level, inside a category large enough to need one; each value belongs to one category, and a category with values has no mechanism outside them."
source = "curated"
level = "mechanism"
required = false
[attribute.class.values]
map = { category = "input-pipeline", meaning = "Map-style: each sample by its id, in a shuffled order without replacement.", search = ["random access", "map-style"] }
stream = { category = "input-pipeline", meaning = "Streaming: whole shards in a shuffled order, records taken in shard order.", search = ["iterable", "sharded", "webdataset"] }
scan-filter = { category = "dataprep", meaning = "Long sequential reads of a raw corpus, a smaller sequential write: language identification, quality filters, PII scrubbing." }
shuffle = { category = "dataprep", meaning = "All-to-all: wide temporary spill, many-to-many reads and writes: global shuffles, repartitioning, exact deduplication by hash." }
dedup-index = { category = "dataprep", meaning = "An index built, then random lookups against it: fuzzy and near-duplicate deduplication.", search = ["minhash", "lsh"] }
repack = { category = "dataprep", meaning = "Many small files into large shards or back, metadata-heavy on one side: tar and WebDataset packing, frame extraction." }
tokenize-pack = { category = "dataprep", meaning = "Text in, large binary token files and their index out (Megatron-style .bin and .idx).", search = ["tokenization"] }
ingest = { category = "dataprep", meaning = "Many writers landing raw data, often as object PUTs: web crawls, sensor dumps.", search = ["crawl", "landing"] }
io500 = { category = "benchmarks", meaning = "The IO500 suite: IOR easy and hard, mdtest easy and hard, find." }
specstorage = { category = "benchmarks", meaning = "SPECstorage Solution: its workloads' defined operation mixes (SWBUILD, VDA, EDA, AI_IMAGE, GENOMICS, …)." }

[attribute.phase]
meaning = "When in a system's life the mechanism's I/O happens; several when its cases span them."
source = "curated"
level = "mechanism"
required = true
multiple = true
[attribute.phase.values]
training = { meaning = "A model being trained (its input, its checkpoints)." }
inference = { meaning = "A model serving requests (its weights loaded, its KV cache, its retrieval).", search = ["serving"] }
indexing = { meaning = "Building an index offline for later search." }
preparation = { meaning = "Preparing data before a job uses it." }
production = { meaning = "A non-AI system doing its work (a build, a database, a simulation)." }

[attribute.domain]
meaning = "The field the mechanism's applications come from; several when it serves more than one (a filter, in place of a directory per field)."
source = "curated"
level = "mechanism"
required = true
multiple = true
[attribute.domain.values]
ai = { meaning = "Machine learning and AI systems.", search = ["ml", "machine learning", "llm"] }
hpc = { meaning = "Scientific and technical computing.", search = ["scientific"] }
enterprise = { meaning = "Business systems: databases, virtual desktops, file serving." }
media = { meaning = "Media capture, production, and delivery." }
life-sciences = { meaning = "Genomics and other life-science pipelines.", search = ["bioinformatics"] }
software-development = { meaning = "Building and testing software.", search = ["devops", "ci"] }

[attribute.application]
meaning = "The library or program whose I/O the mechanism reproduces, as traced."
source = "curated"
level = "mechanism"
required = true
[attribute.application.values]
pytorch-dataloader = { meaning = "PyTorch's DataLoader with worker processes over a map-style Dataset.", search = ["pytorch", "torchvision"] }
numpy = { meaning = "NumPy's np.load of .npz archives." }
h5py = { meaning = "h5py over libhdf5." }
tf-data = { meaning = "TensorFlow's tf.data pipeline.", search = ["tensorflow"] }
pyarrow = { meaning = "Apache Arrow's Parquet reader.", search = ["arrow"] }
torch-dcp = { meaning = "torch.distributed.checkpoint (DCP), save and load.", search = ["fsdp", "pytorch"] }
transformers-safetensors = { meaning = "Hugging Face from_pretrained over safetensors shards.", search = ["hugging face", "huggingface"] }
faiss = { meaning = "FAISS (Meta)." }
diskann = { meaning = "DiskANN (Microsoft), through diskannpy." }
vllm-lmcache = { meaning = "vLLM with LMCache's storage backends.", search = ["vllm", "lmcache"] }

[attribute.format]
meaning = "How the data is laid out in files."
source = "curated"
level = "mechanism"
required = true
[attribute.format.values]
file-per-sample = { meaning = "One file per sample, read whole (JPEG and the like).", search = ["jpeg", "imagefolder", "small files"] }
npz = { meaning = "One NumPy .npz archive per sample." }
hdf5 = { meaning = "HDF5 containers of fixed-size rows." }
tfrecord = { meaning = "TFRecord shards of length-prefixed records." }
parquet = { meaning = "Parquet shards of row groups." }
dcp = { meaning = "DCP shard files (one per rank) and a .metadata file.", search = ["distcp"] }
safetensors = { meaning = "safetensors shards: a JSON header and the tensors' bytes." }
faiss-ivf-ondisk = { meaning = "A FAISS index file and an inverted-lists file mapped whole." }
diskann-index = { meaning = "DiskANN's disk index of 4 KiB sectors, its PQ file, and build temporaries." }
lmcache-chunks = { meaning = "One file per KV chunk of a fixed number of tokens, named by prefix hash.", search = ["kv chunks"] }

# ---- curated: the case ----

[attribute.kind]
meaning = "What a case is for."
source = "curated"
level = "case"
required = true
[attribute.kind.values]
example = { meaning = "An example case: a configuration small enough to trace, showing that the abstract issues the application's calls. Not a job anyone runs as a benchmark." }
use = { meaning = "A use case: a configuration describing a real job, valid at the GPU counts it declares." }
unsettled = { meaning = "Not yet decided between the two; the case's README says why." }

[attribute.modality]
meaning = "What the job's data is, as its users name it."
source = "curated"
level = "case"
required = false
[attribute.modality.values]
image = { meaning = "Still images.", search = ["vision", "cv"] }
volume = { meaning = "Dense arrays per sample (scientific volumes, tensors).", search = ["scientific", "3d"] }
text = { meaning = "Conversations and documents, as tokens.", search = ["chat", "llm", "nlp"] }
agentic = { meaning = "An agent's sessions: long contexts reused across many requests.", search = ["agents", "coding agent"] }
vectors = { meaning = "Embedding vectors.", search = ["embeddings"] }
model-state = { meaning = "A model's weights or a training job's state." , search = ["weights", "optimizer state"] }

[attribute.model-family]
meaning = "The kind of model the case's job trains or serves, when there is one."
source = "curated"
level = "case"
required = false
[attribute.model-family.values]
llm = { meaning = "A large language model, generating text.", search = ["language model", "transformer", "gpt"] }
vision = { meaning = "An image or video model: classification, detection, segmentation.", search = ["cnn", "resnet", "unet"] }
speech = { meaning = "A speech or audio model." }
recommender = { meaning = "A recommender model with embedding tables.", search = ["dlrm"] }
discriminative = { meaning = "A model returning typed decisions with their probabilities rather than generated text.", search = ["classifier", "decision model"] }

# ---- derived ----

[attribute.api]
meaning = "The API the abstract declares for its POSIX names (`posix` key; sync when it declares none), the S3 client's when it has object names. Another API is another workload (CLOSED)."
source = "derived"
level = "case"
[attribute.api.values]
sync = { meaning = "Blocking system calls, one thread per actor." }
mmap = { meaning = "Mapped files: reads are page faults." }
libaio = { meaning = "Linux kernel AIO on O_DIRECT descriptors.", search = ["aio", "o_direct"] }
posix-aio = { meaning = "glibc's POSIX AIO." }
io_uring = { meaning = "io_uring." }

[attribute.writes]
meaning = "Whether the abstract writes (declares an output namespace)."
source = "derived"
level = "case"
[attribute.writes.values]
yes = { meaning = "It writes files of its own." }
no = { meaning = "It only reads." }

[attribute.inputs]
meaning = "Whether it reads what another run wrote (an `input` namespace)."
source = "derived"
level = "case"
[attribute.inputs.values]
yes = { meaning = "It reads another run's output: a restore, a cold KV reader." }
no = { meaning = "It reads datasets and what it wrote itself." }

[attribute.status]
meaning = "What the captures say: the best verdict of `aeiou-trace compare --judge` over the case's captures."
source = "derived"
level = "case"
[attribute.status.values]
untraced = { meaning = "No capture." }
accepted = { meaning = "A capture is within the tolerances." }
not-accepted = { meaning = "Captured, but rows are outside; each has its recorded reason." }
nothing-judged = { meaning = "Captured, but the trace cannot see the data path (a mapped file)." }

# ---- measured (shape.json) ----

[attribute.run_length_read]
meaning = "Contiguous bytes read: the byte-weighted median of read run lengths (half the bytes read move in runs at least this long)."
source = "measured"
level = "case"
unit = "bytes"
tolerance = { relative = 0.25 }
classes = [
  { name = "large", min = 33554432, meaning = "32 MiB or more." },
  { name = "medium", min = 1048576, meaning = "1 MiB to 32 MiB." },
  { name = "small", min = 16384, meaning = "16 KiB to 1 MiB." },
  { name = "tiny", meaning = "Under 16 KiB." },
]

[attribute.run_length_write]
meaning = "Contiguous bytes written: the byte-weighted median of write run lengths."
source = "measured"
level = "case"
unit = "bytes"
tolerance = { relative = 0.25 }
classes = [
  { name = "large", min = 33554432, meaning = "32 MiB or more." },
  { name = "medium", min = 1048576, meaning = "1 MiB to 32 MiB." },
  { name = "small", min = 16384, meaning = "16 KiB to 1 MiB." },
  { name = "tiny", meaning = "Under 16 KiB." },
]

[attribute.request_size_read]
meaning = "The byte-weighted median of read request sizes, as the application asks; a request larger than the file returns short."
source = "measured"
level = "case"
unit = "bytes"
tolerance = { relative = 0.25 }
classes = [
  { name = "large", min = 33554432, meaning = "32 MiB or more." },
  { name = "medium", min = 1048576, meaning = "1 MiB to 32 MiB." },
  { name = "small", min = 16384, meaning = "16 KiB to 1 MiB." },
  { name = "tiny", meaning = "Under 16 KiB." },
]

[attribute.request_size_write]
meaning = "The byte-weighted median of write request sizes."
source = "measured"
level = "case"
unit = "bytes"
tolerance = { relative = 0.25 }
classes = [
  { name = "large", min = 33554432, meaning = "32 MiB or more." },
  { name = "medium", min = 1048576, meaning = "1 MiB to 32 MiB." },
  { name = "small", min = 16384, meaning = "16 KiB to 1 MiB." },
  { name = "tiny", meaning = "Under 16 KiB." },
]

[attribute.read_share]
meaning = "Bytes read over bytes moved."
source = "measured"
level = "case"
unit = "share"
tolerance = { absolute = 0.02 }
classes = [
  { name = "write-only", max = 0.0, meaning = "No reads." },
  { name = "read-only", min = 1.0, meaning = "No writes." },
  { name = "read-mostly", min = 0.8, meaning = "At least 80 % of the bytes read." },
  { name = "mixed", min = 0.2, meaning = "20 % to 80 % read." },
  { name = "write-mostly", meaning = "Under 20 % read." },
]

[attribute.metadata]
meaning = "Metadata calls (open, close, stat, fstat, readdir, mkdir, rmdir, unlink, rename, ftruncate, fallocate) per data call (read, write)."
source = "measured"
level = "case"
unit = "ratio"
tolerance = { relative = 0.05, absolute = 0.005 }
classes = [
  { name = "high", min = 2.0, meaning = "Two or more per data call." },
  { name = "medium", min = 0.5, meaning = "0.5 to 2." },
  { name = "low", min = 0.01, meaning = "0.01 to 0.5." },
  { name = "none", meaning = "Under one in a hundred data calls." },
]

[attribute.reads_own_writes]
meaning = "Whether any read follows a write of the same block (read after write)."
source = "measured"
level = "case"
unit = "flag"
classes = [
  { name = "yes", min = 1.0, meaning = "Some reads read back what the run wrote." },
  { name = "no", meaning = "No read reads what the run wrote." },
]

[attribute.reread]
meaning = "Block reads that read a block again, over all block reads. A training job's value is its epoch count's, a parameter."
source = "measured"
level = "case"
unit = "share"
tolerance = { absolute = 0.02 }
classes = [
  { name = "repeated", min = 0.5, meaning = "Half the reads or more read a block again." },
  { name = "some", min = 0.05, meaning = "5 % to 50 %." },
  { name = "none", meaning = "Under 5 %." },
]

[attribute.skew]
meaning = "The share of block accesses on the busiest 1 % of blocks."
source = "measured"
level = "case"
unit = "share"
tolerance = { absolute = 0.02 }
classes = [
  { name = "skewed", min = 0.1, meaning = "10 % or more of the accesses on 1 % of the blocks." },
  { name = "uniform", meaning = "Under 10 %." },
]
