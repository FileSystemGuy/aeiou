# ABSTRACTS.md §1, small-file training (one sample per file), in AST form.
# Hand-written against schema v0.1 on 2026-09-30; the builder will regenerate it.
# Units are canonical: bytes and nanoseconds. Seeds are decimal (0x5eedda7a).
ast: "0.1"
name: train_small_files
doc: PyTorch DataLoader over an ImageFolder-style corpus; W workers, B files per batch, in-order delivery.

params:
  batch:      { default: 32,        unit: count }
  workers:    { default: 8,         unit: count }
  prefetch:   { default: 2,         unit: count }
  steps:      { default: 500,       unit: count }
  sync_every: { default: 500,       unit: count, doc: "1 for DDP; 500 keeps the brief's reference workload" }
  step_time:  { default: 105000000, unit: ns,    doc: "[measure] GPU step time on the target accelerator" }
  hdr_read:   { default: 1048576,   unit: bytes, doc: "[verify] Python BufferedReader request = st_blksize" }
  enumerate:  { default: false,     doc: "include the startup directory walk (ABSTRACTS.md §9.8)" }

datasets:
  train:
    files:
      pattern: "train/{id div 1300:05}/img_{id:09}.jpg"
      count: 50000000
      size: { lognormal: { median: 112640, sigma: 0.45 } }   # [measure] corpus
      seed: 1592646266
      access: map

actors:
  gpu:
    body:
      - cond:
          if: { param: enumerate }
          then:
            - phase:
                name: enumerate
                body:
                  - loop:
                      index: d
                      to: { dirs: train }
                      body:
                        - let: { name: dh, value: { dir: { dataset: train, id: { index: d } } } }
                        - open: { file: { ref: dh }, flags: [RDONLY, DIRECTORY] }
                        - readdir: { dir: { ref: dh }, repeat: until_end }
                        - close: { file: { ref: dh } }

      - loader:
          name: batches
          index: b
          workers: { param: workers }
          prefetch: { param: prefetch }
          batches: { param: steps }
          ordered: true
          body:
            - loop:
                index: j
                to: { param: batch }
                body:
                  - let: { name: f, value: { consume: train } }      # position = gpu + G·(b·batch + j)
                  - open: { file: { ref: f }, flags: [RDONLY, CLOEXEC] }
                  - fstat: { file: { ref: f } }
                  - ioctl: { file: { ref: f }, request: TCGETS, expect: [ENOTTY] }
                  - lseek: { file: { ref: f }, offset: 0, whence: CUR }
                  - read: { file: { ref: f }, len: { param: hdr_read }, repeat: until_eof }
                  - close: { file: { ref: f } }

      - phase:
          name: train
          body:
            - loop:
                index: step
                to: { param: steps }
                body:
                  - take: { channel: batches }
                  - compute: { ns: { param: step_time } }
                  - cond:                                             # every $sync_every
                      if: { eq: [ { mod: [ { index: step }, { param: sync_every } ] }, 0 ] }
                      then:
                        - barrier: { scope: global }
