# ABSTRACTS.md §3, checkpoint write (torch.distributed.checkpoint shape) inside a minimal
# training loop, with the read-back phase. Exercises: a namespace with size as_written and the
# same-handle until_eof rule (§9.7), parameter arrays, mkdir/rename/fsync, expect on mkdir,
# a conditional on the actor id (§9.1).
# Hand-written against schema v0.1 on 2026-09-30; the builder will regenerate it.
ast: "0.1"
name: ckpt_write_dcp
doc: Every rank writes its shard file per checkpoint step; rank 0 writes .metadata through a temp file and rename.

params:
  steps:      { default: 500,      unit: count }
  step_time:  { default: 323000000, unit: ns }
  ckpt_every: { default: 100,      unit: count }
  items:      { default: 4,        unit: count, doc: "write items per rank [config]; 900 for an 8B model, 4 here to keep the example short" }
  item_bytes: { default: [16777216, 33554432, 16777216, 8388608], unit: bytes, doc: "per-item bytes, 1/G of each tensor [config]" }
  tail:       { default: 65536,    unit: bytes, doc: "[verify] coalesced small records per item" }
  meta_bytes: { default: 2097152,  unit: bytes, doc: "[measure] .metadata size" }
  xfer:       { default: 1048576,  unit: bytes }

namespaces:
  ckpt_dir:
    pattern: "ckpt/step_{step:06}"
    fields: { step: int }
    size: 0
    seed: 1592646274
  ckpt:
    pattern: "ckpt/step_{step:06}/__{rank}_0.distcp"
    fields: { step: int, rank: int }
    size: as_written                    # Σ write lengths of the creating sequence (§9.7)
    seed: 1592646274
  ckpt_meta:
    pattern: "ckpt/step_{step:06}/{name}"
    fields: { step: int, name: str }
    size: { param: meta_bytes }
    seed: 1592646274

actors:
  gpu:
    body:
      - loop:
          index: step
          to: { param: steps }
          body:
            - compute: { ns: { param: step_time } }
            - cond:                                                   # every $ckpt_every
                if: { eq: [ { mod: [ { index: step }, { param: ckpt_every } ] }, 0 ] }
                then:
                  - barrier: { scope: global }                        # collective before save
                  - let: { name: c, value: { object: { namespace: ckpt, fields: { step: { index: step }, rank: { actor: id } } } } }   # bound above both phases
                  - phase:
                      name: ckpt_write
                      body:
                        - mkdir: { dir: { object: { namespace: ckpt_dir, fields: { step: { index: step } } } }, expect: [EEXIST] }
                        - open: { file: { ref: c }, flags: [WRONLY, CREAT, TRUNC, CLOEXEC] }
                        - fstat: { file: { ref: c } }
                        - ioctl: { file: { ref: c }, request: TCGETS, expect: [ENOTTY] }
                        - lseek: { file: { ref: c }, offset: 0, whence: CUR }
                        - loop:
                            index: t
                            to: { param: items }
                            body:
                              - write: { file: { ref: c }, len: { elem: { array: item_bytes, index: { index: t } } } }
                              - write: { file: { ref: c }, len: { param: tail } }
                        - fsync: { file: { ref: c } }
                        - close: { file: { ref: c } }
                        - barrier: { scope: global }                  # gather WriteResults
                        - cond:
                            if: { eq: [ { actor: id }, 0 ] }
                            then:
                              - let: { name: m, value: { object: { namespace: ckpt_meta, fields: { step: { index: step }, name: ".metadata.tmp" } } } }
                              - open: { file: { ref: m }, flags: [WRONLY, CREAT, TRUNC] }
                              - write: { file: { ref: m }, len: { param: meta_bytes } }
                              - fsync: { file: { ref: m } }
                              - close: { file: { ref: m } }
                              - rename: { from: { ref: m }, to: { object: { namespace: ckpt_meta, fields: { step: { index: step }, name: ".metadata" } } } }
                        - barrier: { scope: global }
                  - phase:
                      name: ckpt_readback                             # the restore shape, same position, same handle
                      body:
                        - open: { file: { ref: c }, flags: [RDONLY] }
                        - read: { file: { ref: c }, len: { param: xfer }, repeat: until_eof }
                        - close: { file: { ref: c } }
                        - barrier: { scope: global }
